<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>V-Tik | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="login.css">
</head>
<style>
```css
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Poppins", sans-serif;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at top left,
            rgba(254, 44, 85, 0.25),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom right,
            rgba(0, 242, 234, 0.15),
            transparent 35%
        ),
        #080808;

    color: #fff;
}

button,
input {
    font-family: inherit;
}


/* =========================
   PAGE
========================= */

.login-page {
    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;
}


/* =========================
   LOGIN CARD
========================= */

.login-card {
    width: 100%;

    max-width: 430px;

    background: rgba(20, 20, 20, 0.97);

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 24px;

    padding: 38px 30px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.55);

    animation: cardAppear .5s ease;
}

@keyframes cardAppear {

    from {
        opacity: 0;

        transform:
            translateY(25px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =========================
   LOGO
========================= */

.logo {
    text-align: center;

    font-size: 44px;

    font-weight: 800;

    letter-spacing: -3px;
}

.logo span {
    color: #fff;
}

.logo b {
    color: #fe2c55;
}

.tagline {
    text-align: center;

    color: #888;

    font-size: 12px;

    margin-top: 2px;

    margin-bottom: 30px;
}


/* =========================
   WELCOME
========================= */

.welcome {
    text-align: center;

    margin-bottom: 25px;
}

.welcome h1 {
    font-size: 24px;

    margin-bottom: 6px;
}

.welcome p {
    color: #999;

    font-size: 13px;
}


/* =========================
   ERROR
========================= */

.error-message {
    display: none;

    background:
        rgba(254,44,85,.1);

    border:
        1px solid rgba(254,44,85,.4);

    color: #ff6b88;

    padding: 11px;

    border-radius: 9px;

    text-align: center;

    font-size: 12px;

    margin-bottom: 16px;
}

.error-message.show {
    display: block;
}


/* =========================
   FORM
========================= */

.form-group {
    margin-bottom: 17px;
}

.form-group label {
    display: block;

    color: #ddd;

    font-size: 13px;

    font-weight: 600;

    margin-bottom: 7px;
}


/* =========================
   INPUT
========================= */

.input-box {
    position: relative;
}

.input-box input {
    width: 100%;

    height: 52px;

    padding:
        0 45px
        0 15px;

    border:
        1px solid #333;

    border-radius: 10px;

    background: #161616;

    color: #fff;

    outline: none;

    font-size: 14px;

    transition: .2s;
}

.input-box input::placeholder {
    color: #666;
}

.input-box input:focus {
    border-color: #fe2c55;

    box-shadow:
        0 0 0 3px
        rgba(254,44,85,.12);
}

.input-box > span {
    position: absolute;

    right: 14px;

    top: 50%;

    transform: translateY(-50%);

    font-size: 17px;

    color: #777;
}


/* =========================
   PASSWORD BUTTON
========================= */

#togglePassword {
    position: absolute;

    right: 10px;

    top: 50%;

    transform: translateY(-50%);

    border: none;

    background: transparent;

    color: #aaa;

    font-size: 17px;

    cursor: pointer;
}


/* =========================
   OPTIONS
========================= */

.login-options {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin:
        3px
        0
        20px;

    font-size: 12px;
}

.remember {
    display: flex;

    align-items: center;

    gap: 7px;

    color: #999;

    cursor: pointer;
}

.remember input {
    accent-color: #fe2c55;
}

.login-options a {
    color: #fe2c55;

    text-decoration: none;

    font-weight: 600;
}


/* =========================
   LOGIN BUTTON
========================= */

.login-button {
    width: 100%;

    height: 52px;

    border: none;

    border-radius: 10px;

    background: #fe2c55;

    color: #fff;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    transition: .2s;
}

.login-button:hover {
    background: #e91e49;

    transform:
        translateY(-1px);

    box-shadow:
        0 8px 25px
        rgba(254,44,85,.25);
}

.login-button:disabled {
    opacity: .7;

    cursor: not-allowed;

    transform: none;
}


/* =========================
   DIVIDER
========================= */

.divider {
    display: flex;

    align-items: center;

    gap: 12px;

    color: #555;

    font-size: 11px;

    margin: 25px 0;
}

.divider::before,
.divider::after {
    content: "";

    height: 1px;

    background: #333;

    flex: 1;
}


/* =========================
   DEMO BUTTON
========================= */

.demo-button {
    width: 100%;

    height: 48px;

    border:
        1px solid #333;

    border-radius: 10px;

    background: #181818;

    color: #fff;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;

    transition: .2s;
}

.demo-button:hover {
    background: #222;

    border-color: #555;
}


/* =========================
   SIGN UP
========================= */

.signup-text {
    text-align: center;

    color: #777;

    font-size: 13px;

    margin-top: 25px;
}

.signup-text a {
    color: #fe2c55;

    text-decoration: none;

    font-weight: 700;
}


/* =========================
   FOOTER
========================= */

.footer {
    text-align: center;

    color: #444;

    font-size: 10px;

    margin-top: 27px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

    .login-page {
        padding: 12px;
    }

    .login-card {
        padding:
            30px
            20px;

        border-radius: 20px;
    }

    .logo {
        font-size: 38px;
    }

    .welcome h1 {
        font-size: 22px;
    }

}

</style>

<body>

    <main class="login-page">

        <div class="login-card">

            <!-- LOGO -->
            <div class="logo">
                <span>V</span><b>-Tik</b>
            </div>

            <p class="tagline">
                Share. Create. Connect.
            </p>


            <!-- WELCOME -->
            <div class="welcome">
                <h1>Welcome back 👋</h1>

                <p>
                    Log in to continue to V-Tik
                </p>
            </div>


            <!-- ERROR -->
            <div
                class="error-message"
                id="errorMessage">
            </div>


            <!-- LOGIN FORM -->
            <form id="loginForm">

                <!-- USERNAME -->
                <div class="form-group">

                    <label for="username">
                        Username or Email
                    </label>

                    <div class="input-box">

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter username or email"
                            autocomplete="username"
                            required>

                        <span>👤</span>

                    </div>

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            id="togglePassword">

                            👁

                        </button>

                    </div>

                </div>


                <!-- REMEMBER / FORGOT -->
                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe">

                        <span>
                            Remember me
                        </span>

                    </label>


                    <a
                        href="#"
                        id="forgotPassword">

                        Forgot password?

                    </a>

                </div>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    class="login-button"
                    id="loginButton">

                    <span id="buttonText">
                        Log in
                    </span>

                </button>

            </form>


            <!-- DIVIDER -->
            <div class="divider">
                <span>OR</span>
            </div>


            <!-- DEMO LOGIN -->
            <button
                class="demo-button"
                id="demoLogin">

                🚀 Continue with Demo Account

            </button>


            <!-- SIGN UP -->
            <p class="signup-text">

                Don't have an account?

                <a href="signup.html">
                    Sign up
                </a>

            </p>


            <!-- FOOTER -->
            <p class="footer">
                © 2026 V-Tik. All rights reserved.
            </p>

        </div>

    </main>


    <!-- JAVASCRIPT -->
    <script src="login.js"></script>

</body>
</html>
