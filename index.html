
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#08090d">
    <meta name="description" content="Discover, watch, share, and create short videos on V-Tik.">

    <title>V-Tik — Short Videos</title>
<link rel="icon" type="logo.png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            color-scheme: dark;
            --bg: #08090d;
            --panel: #111219;
            --text: #f8f8fb;
            --muted: #a4a6b4;
            --pink: #fe2c55;
            --cyan: #25f4ee;
            --border: rgba(255,255,255,.09);
        }

        * { box-sizing: border-box; }

        html {
            scroll-behavior: smooth;
            background: var(--bg);
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Plus Jakarta Sans", sans-serif;
        }

        button, input { font: inherit; }
        button { cursor: pointer; }
        a { color: inherit; text-decoration: none; }
        [hidden] { display: none !important; }

        body.modal-open { overflow: hidden; }

        /* Header */

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            min-height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 10px 4%;
            border-bottom: 1px solid var(--border);
            background: rgba(8,9,13,.94);
            backdrop-filter: blur(18px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .brand-v {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--pink);
            color: white;
        }

        .search {
            display: flex;
            align-items: center;
            gap: 9px;
            width: min(440px, 45vw);
            min-height: 42px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #171820;
        }

        .search input {
            width: 100%;
            min-width: 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: white;
        }

        .search input::placeholder { color: var(--muted); }

        .clear-search {
            border: 0;
            background: transparent;
            color: white;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .create-btn, .round-btn {
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 0 13px;
            border: 1px solid var(--border);
            border-radius: 11px;
            background: #171820;
            color: white;
        }

        .create-btn {
            background: var(--pink);
            border-color: var(--pink);
            font-weight: 700;
        }

        .round-btn {
            width: 40px;
            padding: 0;
            font-size: 18px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--pink), #7c3aed);
            color: white;
            font-weight: 800;
            font-size: 12px;
        }

        /* Layout */

        .shell {
            display: grid;
            grid-template-columns: 210px minmax(0, 1fr);
            gap: 24px;
            max-width: 1500px;
            margin: 0 auto;
            padding: 22px 3%;
        }

        .sidebar {
            position: sticky;
            top: 90px;
            align-self: start;
        }

        .nav-group {
            display: grid;
            gap: 7px;
        }

        .nav-item {
            width: 100%;
            min-height: 46px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 14px;
            border: 0;
            border-radius: 11px;
            background: transparent;
            color: #c5c6d0;
            text-align: left;
            font-weight: 600;
        }

        .nav-item > span:first-child {
            width: 22px;
            text-align: center;
            font-size: 20px;
        }

        .nav-item:hover, .nav-item.active {
            background: #20212b;
            color: white;
        }

        .nav-item.active > span:first-child { color: var(--pink); }

        .side-title {
            margin: 28px 14px 12px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .side-bottom {
            margin: 30px 14px 0;
            color: var(--muted);
            font-size: 11px;
            line-height: 2;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
        }

        /* Video area: no feed heading */

        .main-content {
            min-width: 0;
            padding-bottom: 30px;
        }

        .video-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .video-card {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 48px;
            align-items: end;
            gap: 12px;
            width: min(100%, 720px);
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--panel);
            scroll-margin-top: 80px;
        }

        .video-card-main { min-width: 0; }

        .video-stage {
            position: relative;
            min-width: 0;
        }

        .feed-video {
            display: block;
            width: 100%;
            max-height: 78vh;
            aspect-ratio: 9 / 16;
            object-fit: contain;
            border-radius: 13px;
            background: #000;
        }

        .video-play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            display: none;
            place-items: center;
            width: 56px;
            height: 56px;
            transform: translate(-50%, -50%);
            border: 1px solid #ffffff55;
            border-radius: 50%;
            background: #0009;
            color: white;
            font-size: 22px;
            pointer-events: none;
        }

        .video-card.is-paused .video-play-overlay { display: grid; }

        .video-info { padding: 13px 3px 3px; }

        .video-details {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 9px;
        }

        .creator-avatar {
            width: 38px;
            height: 38px;
            flex: 0 0 38px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--pink), #7c3aed);
            font-size: 12px;
            font-weight: 800;
        }

        .creator-meta {
            flex: 1;
            min-width: 0;
        }

        .creator-meta strong, .creator-meta span {
            display: block;
            overflow-wrap: anywhere;
        }

        .creator-meta span {
            margin-top: 3px;
            color: var(--muted);
            font-size: 12px;
        }

        .video-caption {
            margin: 0;
            font-size: 13px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .video-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding-bottom: 10px;
        }

        .video-actions button {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 0;
            border: 0;
            background: transparent;
            color: white;
            font-size: 10px;
        }

        .video-actions button span {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: #22232c;
            font-size: 18px;
            transition: background .2s, color .2s;
        }

        .video-actions button:hover span { color: var(--cyan); }

        .video-actions .like-action.active span { color: var(--pink); }

        .follow-btn {
            margin-left: auto;
            padding: 7px 10px;
            border: 0;
            border-radius: 9px;
            background: var(--pink);
            color: white;
            font-size: 11px;
            font-weight: 700;
        }

        .feed-empty {
            padding: 30px 15px;
            color: var(--muted);
            text-align: center;
        }

        /* Scroll controls */

        .scroll-controls {
            position: fixed;
            right: 18px;
            bottom: 22px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .scroll-controls button {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: #20212b;
            color: white;
            font-size: 21px;
        }

        .scroll-controls button:hover { background: var(--pink); }

        /* Modals */

        .modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal.active {
            display: flex;
        }

        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: #000b;
            backdrop-filter: blur(7px);
        }

        .modal-box {
            position: relative;
            z-index: 1;
            width: min(100%, 480px);
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 19px;
            background: #15161e;
            box-shadow: 0 20px 80px #0008;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        .modal-header h2, .create-box h2 {
            margin: 0;
            font-size: 21px;
        }

        .close, .viewer-close {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: #252631;
            color: white;
        }

        .create-box > .close { float: right; }

        .upload-zone {
            clear: both;
            padding: 28px 14px;
            border: 1px dashed #555766;
            border-radius: 14px;
            text-align: center;
        }

        .upload-icon-wrapper {
            margin-bottom: 12px;
            color: var(--pink);
            font-size: 30px;
        }

        .upload-zone p, .file-name-muted {
            color: var(--muted);
            font-size: 13px;
        }

        .upload-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 10px 15px;
            border-radius: 9px;
            background: var(--pink);
            color: white;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .preview-container { margin-top: 16px; }

        .upload-preview {
            display: block;
            width: 100%;
            max-height: 300px;
            border-radius: 12px;
            background: black;
        }

        .caption-wrapper { margin-top: 16px; }

        .caption-input, .comment-form input {
            width: 100%;
            min-height: 44px;
            padding: 11px;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            background: #20212b;
            color: white;
        }

        .caption-input:focus, .comment-form input:focus {
            border-color: var(--pink);
        }

        .post-video-btn {
            width: 100%;
            min-height: 44px;
            margin-top: 15px;
            border: 0;
            border-radius: 10px;
            background: var(--pink);
            color: white;
            font-weight: 800;
        }

        .post-video-btn:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 70px;
            max-height: 45vh;
            overflow-y: auto;
        }

        .comment-item {
            padding: 12px;
            border-radius: 11px;
            background: #20212b;
        }

        .comment-item p {
            margin: 5px 0 0;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .comment-form {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .comment-form input { min-width: 0; flex: 1; }

        .comment-form button {
            padding: 0 15px;
            border: 0;
            border-radius: 9px;
            background: var(--pink);
            color: white;
            font-weight: 700;
        }

        /* Fullscreen viewer */

        .viewer {
            position: fixed;
            inset: 0;
            z-index: 1100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #000f;
        }

        .viewer.active { display: flex; }

        .viewer video {
            width: auto;
            max-width: 100%;
            height: auto;
            max-height: 90vh;
            background: black;
        }

        .viewer-close {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 2;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 25px;
            z-index: 2000;
            max-width: calc(100% - 30px);
            padding: 12px 17px;
            transform: translateX(-50%);
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #242530;
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s;
        }

        .toast.show { opacity: 1; }

        .mobile-nav { display: none; }

        @media (max-width: 900px) {
            .shell {
                grid-template-columns: 175px minmax(0, 1fr);
                gap: 16px;
            }
        }

        @media (max-width: 700px) {
            .topbar {
                min-height: 60px;
                gap: 9px;
                padding: 9px 12px;
            }

            .brand { font-size: 18px; }
            .brand-v { width: 30px; height: 30px; }

            .search {
                flex: 1;
                width: auto;
                min-width: 0;
                padding: 0 8px;
            }

            .search input { font-size: 12px; }

            .topbar-actions { gap: 6px; }

            .create-btn {
                width: 36px;
                min-height: 36px;
                padding: 0;
            }

            .create-btn .create-label,
            .round-btn,
            .profile-link { display: none; }

            .shell {
                display: block;
                padding: 10px 8px 85px;
            }

            .sidebar { display: none; }

            .main-content { padding-bottom: 15px; }

            .video-list { gap: 13px; }

            .video-card {
                grid-template-columns: minmax(0, 1fr) 39px;
                gap: 7px;
                width: 100%;
                padding: 7px;
                border-radius: 14px;
                scroll-margin-top: 68px;
            }

            .feed-video {
                max-height: 76vh;
                border-radius: 10px;
            }

            .video-actions { gap: 12px; }

            .video-actions button span {
                width: 34px;
                height: 34px;
                font-size: 15px;
            }

            .video-actions button { font-size: 9px; }

            .creator-avatar {
                width: 33px;
                height: 33px;
                flex-basis: 33px;
            }

            .video-caption { font-size: 12px; }

            .scroll-controls {
                right: 9px;
                bottom: 76px;
            }

            .scroll-controls button {
                width: 36px;
                height: 36px;
            }

            .mobile-nav {
                position: fixed;
                right: 0;
                bottom: 0;
                left: 0;
                z-index: 200;
                display: flex;
                align-items: center;
                justify-content: space-around;
                min-height: 63px;
                padding: 5px 6px env(safe-area-inset-bottom);
                border-top: 1px solid var(--border);
                background: rgba(14,15,21,.97);
                backdrop-filter: blur(18px);
            }

            .mobile-nav button, .mobile-profile-link {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 3px;
                border: 0;
                background: transparent;
                color: var(--muted);
                font-size: 10px;
            }

            .mobile-nav button > span:first-child { font-size: 20px; }
            .mobile-nav button.active { color: white; }
            .mobile-nav button.active > span:first-child { color: var(--pink); }

            .mobile-nav .mobile-create > span {
                width: 37px;
                height: 31px;
                display: grid;
                place-items: center;
                border-radius: 9px;
                background: var(--pink);
                color: white;
                font-size: 24px;
            }

            .mobile-profile-link .avatar {
                width: 25px;
                height: 25px;
                font-size: 9px;
            }

            .modal { padding: 10px; }
            .modal-box { padding: 19px; }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            *, *::before, *::after { transition: none !important; }
        }
    </style>

    <script src="./app.js" defer></script>
</head>

<body>
    <header class="topbar">
        <a href="./index.html" class="brand" aria-label="V-Tik home">
            <span class="brand-v">V</span>
            <span> TIK</span>
        </a>

        <div class="search">
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="search"
                   placeholder="Search videos..."
                   autocomplete="off" aria-label="Search videos">
            <button id="clearSearch" class="clear-search"
                    type="button" hidden aria-label="Clear search">✕</button>
        </div>

        <div class="topbar-actions">
            <button id="createTop" class="create-btn" type="button"
                    aria-controls="createModal" aria-haspopup="dialog">
                <span aria-hidden="true">＋</span>
                <span class="create-label">Create</span>
            </button>

            <button class="round-btn" id="notificationBtn"
                    type="button" aria-label="Notifications">♧</button>

            <a href="log.html" class="profile-link" aria-label="Profile">
                <span class="avatar">TR</span>
            </a>
        </div>
    </header>

    <div class="shell">
        <aside class="sidebar">
            <nav class="nav-group" aria-label="Main navigation">
                <button class="nav-item active" type="button" data-section="home">
                    <span>⌂</span><span>Home</span>
                </button>
                <button class="nav-item" type="button" data-section="discover">
                    <span>⌕</span><span>Discover</span>
                </button>
                <button class="nav-item" type="button" data-section="following">
                    <span>♧</span><span>Following</span>
                </button>
                <button class="nav-item" type="button" data-section="liked">
                    <span>♡</span><span>Liked</span>
                </button>
                <button class="nav-item" type="button" data-section="saved">
                    <span>▤</span><span>Saved</span>
                </button>
            </nav>

            <div class="side-title">Explore</div>

            <nav class="nav-group" aria-label="Explore categories">
                <button class="nav-item" type="button" data-section="trending">
                    <span>🔥</span><span>Trending</span>
                </button>
                <button class="nav-item" type="button" data-section="music">
                    <span>♫</span><span>Music</span>
                </button>
                <button class="nav-item" type="button" data-section="gaming">
                    <span>🎮</span><span>Gaming</span>
                </button>
            </nav>

            <div class="side-bottom">
                <div class="footer-links">
                    <a href="about.html">About</a>
                    <a href="privacy.html">Privacy</a>
                    <a href="#terms">Terms</a>
                </div>
                <p>© 2026 V-Tik</p>
            </div>
        </aside>

        <main class="main-content" id="mainContent">
            <!-- No feed heading: JavaScript inserts video cards here. -->
            <div class="video-list" id="videoList"></div>

            <p class="feed-empty" id="emptyFeed" hidden role="status">
                No videos found. Try another search.
            </p>
        </main>
    </div>

    <div class="scroll-controls" aria-label="Video navigation">
        <button id="scrollUp" type="button" aria-label="Previous video">↑</button>
        <button id="scrollDown" type="button" aria-label="Next video">↓</button>
    </div>

    <nav class="mobile-nav" aria-label="Mobile navigation">
        <button class="active" type="button" data-section="home">
            <span>⌂</span><span>Home</span>
        </button>
        <button type="button" data-section="discover">
            <span>⌕</span><span>Discover</span>
        </button>
        <button class="mobile-create" id="mobileCreate" type="button"
                aria-label="Create video" aria-controls="createModal">
            <span>＋</span>
        </button>
        <button type="button" data-section="following">
            <span>♧</span><span>Following</span>
        </button>
        <a href="log.html" class="mobile-profile-link">
            <span class="avatar">TR</span><span>Profile</span>
        </a>
    </nav>

    <!-- Comments modal -->
    <div class="modal" id="commentsModal" role="dialog"
         aria-modal="true" aria-labelledby="commentsTitle" aria-hidden="true">
        <div class="modal-backdrop" data-close-modal></div>

        <div class="modal-box">
            <div class="modal-header">
                <h2 id="commentsTitle">Comments</h2>
                <button class="close" id="closeComments" data-close-modal
                        type="button" aria-label="Close comments">✕</button>
            </div>

            <div class="comments-list" id="commentsList"></div>

            <form class="comment-form" id="commentForm">
                <input id="commentInput" name="comment" type="text"
                       maxlength="180" placeholder="Add a comment..."
                       autocomplete="off" required>
                <button id="postCommentBtn" type="submit">Post</button>
            </form>
        </div>
    </div>

    <!-- Upload modal -->
    <div class="modal" id="createModal" role="dialog"
         aria-modal="true" aria-labelledby="createTitle" aria-hidden="true">
        <div class="modal-backdrop" data-close-modal></div>

        <div class="modal-box create-box">
            <button class="close" id="closeCreate" data-close-modal
                    type="button" aria-label="Close upload dialog">✕</button>

            <h2 id="createTitle">Create on V-Tik</h2>

            <input id="videoPicker" name="video" type="file"
                   accept="video/*" hidden>

            <div class="upload-zone" id="uploadZone">
                <div class="upload-icon-wrapper" aria-hidden="true">⇧</div>
                <p>Select a video from your device.</p>
                <label for="videoPicker" class="upload-btn">Choose video</label>
            </div>

            <div class="preview-container" id="previewContainer" hidden>
                <video id="uploadPreview" class="upload-preview"
                       controls muted loop playsinline></video>
                <p id="uploadName" class="file-name-muted"></p>
            </div>

            <div class="caption-wrapper">
                <input id="videoCaption" class="caption-input"
                       name="caption" type="text" maxlength="180"
                       placeholder="Write a caption...">
            </div>

            <button id="postVideo" class="post-video-btn"
                    type="button" disabled>Post video</button>
        </div>
    </div>

    <!-- Optional fullscreen viewer -->
    <div class="viewer" id="videoViewer" aria-hidden="true">
        <button class="viewer-close" id="viewerClose" data-close-modal
                type="button" aria-label="Close video">✕</button>
        <video id="viewerVideo" controls playsinline></video>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        (() => {
            const $ = (selector, root = document) => root.querySelector(selector);
            const $$ = (selector, root = document) =>
                [...root.querySelectorAll(selector)];

            let autoplayObserver = null;
            let scrollTimer = null;

            function getVideos() {
                return $$("#videoList video.feed-video");
            }

            function setupAutoplay() {
                if (autoplayObserver) {
                    autoplayObserver.disconnect();
                }

                const videos = getVideos();

                if (!videos.length) return;

                videos.forEach(video => {
                    video.autoplay = true;
                    video.muted = true;
                    video.defaultMuted = true;
                    video.playsInline = true;
                    video.setAttribute("muted", "");
                    video.setAttribute("playsinline", "");
                    video.preload = "metadata";

                    video.addEventListener("play", () => {
                        videos.forEach(other => {
                            if (other !== video && !other.paused) {
                                other.pause();
                            }
                        });
                    });

                    video.addEventListener("click", () => {
                        if (video.paused) {
                            video.muted = true;
                            video.play().catch(() => {});
                        } else {
                            video.pause();
                        }
                    });

                    const card = video.closest(".video-card");
                    if (card) {
                        const updatePaused = () => {
                            card.classList.toggle("is-paused", video.paused);
                        };

                        video.addEventListener("play", updatePaused);
                        video.addEventListener("pause", updatePaused);
                        updatePaused();
                    }
                });

                autoplayObserver = new IntersectionObserver(entries => {
                    const visible = entries
                        .filter(entry => entry.isIntersecting)
                        .sort((a, b) => b.intersectionRatio - a.intersectionRatio);

                    const best = visible.find(entry => entry.intersectionRatio >= 0.55);

                    videos.forEach(video => {
                        if (!best || best.target !== video) {
                            video.pause();
                        }
                    });

                    if (best) {
                        const video = best.target;
                        video.muted = true;
                        video.play().catch(() => {
                            // Some browsers require a user interaction first.
                        });
                    }
                }, {
                    threshold: [0, 0.25, 0.4, 0.55, 0.7, 0.9, 1]
                });

                videos.forEach(video => autoplayObserver.observe(video));
            }

            function scheduleAutoplayRefresh() {
                clearTimeout(scrollTimer);
                scrollTimer = setTimeout(setupAutoplay, 250);
            }

            function scrollToVideo(direction) {
                const cards = $$("#videoList .video-card");
                if (!cards.length) return;

                const center = window.innerHeight / 2;
                let closest = 0;
                let distance = Infinity;

                cards.forEach((card, index) => {
                    const rect = card.getBoundingClientRect();
                    const d = Math.abs(rect.top + rect.height / 2 - center);

                    if (d < distance) {
                        distance = d;
                        closest = index;
                    }
                });

                const next = Math.max(0, Math.min(cards.length - 1, closest + direction));

                cards[next].scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });

                setTimeout(setupAutoplay, 350);
            }

            $("#scrollUp")?.addEventListener("click", () => scrollToVideo(-1));
            $("#scrollDown")?.addEventListener("click", () => scrollToVideo(1));

            window.addEventListener("scroll", scheduleAutoplayRefresh, { passive: true });
            window.addEventListener("resize", scheduleAutoplayRefresh);

            /*
             * The app.js script renders the video cards.
             * Wait briefly and observe any cards it creates.
             */
            const feed = $("#videoList");

            if (feed) {
                const renderObserver = new MutationObserver(() => {
                    setupAutoplay();
                });

                renderObserver.observe(feed, { childList: true, subtree: true });
            }

            $("#mobileCreate")?.addEventListener("click", () => {
                $("#createTop")?.click();
            });

            $("#notificationBtn")?.addEventListener("click", () => {
                const toast = $("#toast");
                if (!toast) return;

                toast.textContent = "You're all caught up!";
                toast.classList.add("show");
                setTimeout(() => toast.classList.remove("show"), 2200);
            });

            const search = $("#searchInput");
            const clear = $("#clearSearch");

            search?.addEventListener("input", () => {
                if (clear) clear.hidden = !search.value;
            });

            clear?.addEventListener("click", () => {
                if (!search) return;
                search.value = "";
                search.dispatchEvent(new Event("input", { bubbles: true }));
                search.focus();
            });

            const picker = $("#videoPicker");
            const preview = $("#uploadPreview");
            const previewContainer = $("#previewContainer");
            const uploadName = $("#uploadName");
            const postButton = $("#postVideo");
            let previewURL = null;

            picker?.addEventListener("change", () => {
                const file = picker.files?.[0];
                if (!file) return;

                if (!file.type.startsWith("video/")) {
                    alert("Please select a video file.");
                    picker.value = "";
                    return;
                }

                if (previewURL) URL.revokeObjectURL(previewURL);
                previewURL = URL.createObjectURL(file);

                if (preview) {
                    preview.src = previewURL;
                    preview.load();
                }

                if (uploadName) uploadName.textContent = file.name;
                if (previewContainer) previewContainer.hidden = false;
                if (postButton) postButton.disabled = false;
            });

            $("#uploadZone")?.addEventListener("dragover", event => {
                event.preventDefault();
            });

            $("#uploadZone")?.addEventListener("drop", event => {
                event.preventDefault();

                const file = event.dataTransfer?.files?.[0];
                if (!file || !picker) return;

                if (!file.type.startsWith("video/")) {
                    alert("Please drop a video file.");
                    return;
                }

                try {
                    const transfer = new DataTransfer();
                    transfer.items.add(file);
                    picker.files = transfer.files;
                    picker.dispatchEvent(new Event("change", { bubbles: true }));
                } catch (error) {
                    console.error("Could not load the dropped video.", error);
                }
            });

            $$("[data-close-modal]").forEach(button => {
                button.addEventListener("click", () => {
                    const modal = button.closest(".modal");
                    const viewer = button.closest(".viewer");

                    if (modal) {
                        modal.classList.remove("active");
                        modal.setAttribute("aria-hidden", "true");
                        document.body.classList.remove("modal-open");
                    }

                    if (viewer) {
                        viewer.classList.remove("active");
                        viewer.setAttribute("aria-hidden", "true");

                        const viewerVideo = $("#viewerVideo");
                        if (viewerVideo) {
                            viewerVideo.pause();
                            viewerVideo.removeAttribute("src");
                            viewerVideo.load();
                        }
                    }
                });
            });

            document.addEventListener("keydown", event => {
                if (event.key !== "Escape") return;

                $$(".modal.active").forEach(modal => {
                    modal.classList.remove("active");
                    modal.setAttribute("aria-hidden", "true");
                });

                const viewer = $("#videoViewer");
                viewer?.classList.remove("active");
                viewer?.setAttribute("aria-hidden", "true");
                document.body.classList.remove("modal-open");

                $("#viewerVideo")?.pause();
            });

            // Allow app.js or the browser console to refresh autoplay.
            window.VTik = window.VTik || {};
            window.VTik.refreshAutoplay = setupAutoplay;

            setupAutoplay();
        })();
    </script>
</body>
</html>
