```css
/* ===============================
   V-Tik Signup Page
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --red: #fe2c55;
    --pink: #ff0050;
    --cyan: #25f4ee;
    --dark: #050505;
    --card: rgba(20, 20, 20, 0.92);
    --text: #ffffff;
    --muted: #a7a7a7;
    --border: #303030;
}

body {
    min-height: 100vh;
    font-family: "Poppins", sans-serif;
    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(254, 44, 85, 0.25),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(37, 244, 238, 0.15),
            transparent 30%
        ),
        var(--dark);

    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
}

/* Background */

.background-shape {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
}

.shape-one {
    width: 280px;
    height: 280px;
    background: rgba(254, 44, 85, 0.18);
    top: -100px;
    left: -100px;
}

.shape-two {
    width: 300px;
    height: 300px;
    background: rgba(37, 244, 238, 0.12);
    bottom: -120px;
    right: -100px;
}

/* Container */

.signup-container {
    width: 100%;
    max-width: 480px;
    padding: 25px;
    position: relative;
    z-index: 2;
}

/* Card */

.signup-card {
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    padding: 35px;
    box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);

    backdrop-filter: blur(20px);
}

/* Logo */

.logo {
    text-align: center;
    font-size: 36px;
    font-weight: 800;
    margin-bottom: 22px;
    letter-spacing: -2px;
}

.logo span {
    color: var(--cyan);
    text-shadow: 3px 3px 0 var(--red);
}

/* Heading */

h1 {
    text-align: center;
    font-size: 27px;
    margin-bottom: 7px;
}

.subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 28px;
}

/* Message */

.message {
    display: none;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 18px;
    text-align: center;
}

.message.error {
    display: block;
    background: rgba(254, 44, 85, 0.12);
    border: 1px solid rgba(254, 44, 85, 0.35);
    color: #ff6b8b;
}

.message.success {
    display: block;
    background: rgba(37, 244, 238, 0.1);
    border: 1px solid rgba(37, 244, 238, 0.3);
    color: var(--cyan);
}

/* Input */

.input-group {
    margin-bottom: 18px;
}

.input-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 7px;
}

.input-group input {
    width: 100%;
    height: 52px;
    padding: 0 15px;

    background: #111;
    border: 1px solid var(--border);
    border-radius: 12px;

    color: white;
    outline: none;

    font-family: inherit;
    font-size: 14px;

    transition: 0.25s;
}

.input-group input::placeholder {
    color: #666;
}

.input-group input:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(254, 44, 85, 0.1);
}

.input-group small {
    display: block;
    color: #777;
    font-size: 10px;
    margin-top: 5px;
}

/* Password */

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 50px;
}

.eye-button {
    position: absolute;
    right: 7px;
    top: 7px;

    width: 38px;
    height: 38px;

    border: none;
    border-radius: 9px;

    background: transparent;
    color: white;

    cursor: pointer;
    font-size: 17px;
}

.eye-button:hover {
    background: #222;
}

/* Signup button */

.signup-button {
    width: 100%;
    height: 52px;

    border: none;
    border-radius: 13px;

    background: linear-gradient(
        135deg,
        var(--red),
        var(--pink)
    );

    color: white;

    font-family: inherit;
    font-size: 15px;
    font-weight: 700;

    cursor: pointer;

    margin-top: 5px;

    transition:
        transform 0.2s,
        box-shadow 0.2s;
}

.signup-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(254, 44, 85, 0.25);
}

.signup-button:active {
    transform: scale(0.98);
}

/* Divider */

.divider {
    text-align: center;
    margin: 25px 0 15px;
    color: #777;
    font-size: 12px;
}

/* Login */

.login-link {
    display: block;

    text-align: center;

    color: var(--cyan);
    text-decoration: none;

    font-size: 14px;
    font-weight: 700;

    border: 1px solid #333;
    border-radius: 12px;

    padding: 13px;

    transition: 0.2s;
}

.login-link:hover {
    background: rgba(37, 244, 238, 0.06);
    border-color: var(--cyan);
}

/* Terms */

.terms {
    text-align: center;
    color: #666;
    font-size: 10px;
    line-height: 1.6;
    margin-top: 22px;
}

/* Mobile */

@media (max-width: 500px) {

    .signup-container {
        padding: 15px;
    }

    .signup-card {
        padding: 25px 20px;
        border-radius: 20px;
    }

    h1 {
        font-size: 24px;
    }

    .logo {
        font-size: 32px;
    }
}

</style>
<body>

    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>

    <main class="signup-container">

        <section class="signup-card">

            <div class="logo">
                <span>V</span>-Tik
            </div>

            <h1>Create account</h1>

            <p class="subtitle">
                Join V-Tik and start sharing your videos.
            </p>

            <div id="message" class="message"></div>

            <form id="signupForm">

                <div class="input-group">
                    <label for="name">Full name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Choose a username"
                        autocomplete="username"
                        required
                    >

                    <small>
                        Your username is case-sensitive.
                    </small>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <div class="password-box">
                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            id="passwordToggle"
                            class="eye-button"
                        >
                            👁️
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">
                        Confirm password
                    </label>

                    <div class="password-box">
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Repeat your password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            id="confirmPasswordToggle"
                            class="eye-button"
                        >
                            👁️
                        </button>
                    </div>
                </div>

                <button
                    type="submit"
                    class="signup-button"
                >
                    Create Account
                </button>

            </form>

            <div class="divider">
                <span>Already have an account?</span>
            </div>

            <a href="log.html" class="login-link">
                Log in
            </a>

            <p class="terms">
                By creating an account, you agree to use V-Tik responsibly.
            </p>

        </section>

    </main>

    <script src="signup.js"></script>

</body>
</html>
